state_comptroller:
  dependencies:
    - pipeline: ./state_comptroller/chapters
  pipeline:
    - run: add_metadata
      parameters:
        name: related-items-state-comptroller
        title: פריטים קשורים - דוחות מבקר המדינה
        revision: '2026-11-08'
    - flow: link_source
      parameters:
        source: state_comptroller
        out-path: /var/datapackages/related_items/state_comptroller

gov_decisions:
  dependencies:
    - pipeline: ./government_decisions/government_decisions
  pipeline:
    - run: add_metadata
      parameters:
        name: related-items-gov-decisions
        title: פריטים קשורים - החלטות ממשלה
        revision: '2026-11-08'
    - flow: link_source
      parameters:
        source: gov_decisions
        out-path: /var/datapackages/related_items/gov_decisions

analysis:
  dependencies:
    - pipeline: ./analysis/pages
  pipeline:
    - run: add_metadata
      parameters:
        name: related-items-analysis
        title: פריטים קשורים - עמודי ניתוח
        revision: '2026-11-09'
    - flow: link_source
      parameters:
        source: analysis
        out-path: /var/datapackages/related_items/analysis

# Not a dependency: related_items/analysis. dpp holds a pipeline while any dependency is unsuccessful or hasn't run,
# so the analysis pages (a separate chain) would block the comptroller and decision links. Their links are merged
# from the last successful output at the next run (gov_decisions runs daily); a missing output is skipped.
all:
  dependencies:
    - pipeline: ./related_items/state_comptroller
    - pipeline: ./related_items/gov_decisions
    - pipeline: ./state_comptroller/issues
  pipeline:
    - run: add_metadata
      parameters:
        name: related-items
        title: פריטים קשורים
        revision: '2026-11-08'
    - flow: merge_sources
      parameters:
        sources:
          - /var/datapackages/related_items/state_comptroller
          - /var/datapackages/related_items/gov_decisions
          - /var/datapackages/related_items/analysis
        issues: /var/datapackages/state_comptroller/issues
        budget-owners: true
        out-path: /var/datapackages/related_items/all
