state_comptroller_audits:
  kind: indexer
  # 2: the first run's mirror rows were marked indexed though the run failed before ES
  # 3: re-index with the related_items of the 39 re-detected Hebrew chapters and the rebuilt issues (2026-11-10)
  # 4: earlier_reports[].doc_id (add_earlier_report_ids)
  revision: 4
  dependent_pipeline: ./state_comptroller/documents
  source_datapackage: /var/datapackages/state_comptroller/documents/datapackage.json
  page-title-pattern: 'דוח מבקר המדינה - {title}'
  chunker:
    - 'דוח מבקר המדינה: "{title}" ({publication_title})'
    - field: summary
      method: chunk
      chunk_size: 2000
      chunk_overlap: 400
    - field: findings_text
      method: chunk
      chunk_size: 2000
      chunk_overlap: 400
  key-fields:
    - chapter_id
  date-range:
    type: date-range
    from-field: publish_date
    to-field: publish_date
  extra-steps:
    # The documents datapackage holds both comptroller types, and load_big's `resource` doesn't limit the load
    - run: drop_resource
      parameters:
        resource: state_comptroller_issues
    - flow: add_related_items
      parameters:
        resource: state_comptroller_audits
        doc-id-pattern: 'state_comptroller_audits/{chapter_id}'
    - flow: add_earlier_report_ids
      parameters:
        resource: state_comptroller_audits
        doc-id-pattern: 'state_comptroller_audits/{chapter_id}'

state_comptroller_issues:
  kind: indexer
  # 2: re-index with the related_items of the rebuilt issues (2026-11-10)
  revision: 2
  dependent_pipeline: ./state_comptroller/documents
  source_datapackage: /var/datapackages/state_comptroller/documents/datapackage.json
  page-title-pattern: 'מעקב ליקוי מדוחות מבקר המדינה - {title}'
  chunker:
    - 'ליקוי שהעלה מבקר המדינה: "{title}"'
    - field: description
      method: chunk
      chunk_size: 2000
      chunk_overlap: 400
  key-fields:
    - issue_id
  date-range:
    type: date-range
    from-field: first_reported
    to-field: last_seen
  extra-steps:
    # The documents datapackage holds both comptroller types, and load_big's `resource` doesn't limit the load
    - run: drop_resource
      parameters:
        resource: state_comptroller_audits
    - flow: add_related_items
      parameters:
        resource: state_comptroller_issues
        doc-id-pattern: 'state_comptroller_issues/{issue_id}'
