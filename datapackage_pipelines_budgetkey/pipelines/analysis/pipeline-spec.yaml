# AI-generated analysis pages - see topics.py (discovery) and pages.py (generation).

topics:
  # Weekly, after the simpledb tables are rebuilt (process_simple_dbs runs Monday 00:00).
  schedule:
    crontab: "0 6 * * 2"
  pipeline:
    - run: add_metadata
      parameters:
        name: analysis_topics
        revision: '2026-10-02-01'
    - flow: topics
      parameters:
        max-new: 40

pages:
  # Runs after topic discovery: generates pages for new topics, regenerates stale ones (prompt changes, age,
  # a new budget year, figures that no longer run) and re-renders the rest when their data changed.
  dependencies:
    - pipeline: ./analysis/topics
  pipeline:
    - run: add_metadata
      parameters:
        name: analysis_pages
        revision: '2026-10-02-01'
    - flow: pages
      parameters:
        max-generations: 25
        parallel: 3
